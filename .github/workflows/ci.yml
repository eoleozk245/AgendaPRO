# Verificações de todo pull request e da main (D-017).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, formatação, tipos, testes, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Banco (migrações + testes pgTAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Instalar PostgreSQL 16 e pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgtap
      - name: Aplicar migrações e rodar testes
        run: scripts/test-db.sh
        env:
          PG_BIN: /usr/lib/postgresql/16/bin

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de navegador (Supabase simulado)
        run: npm run test:e2e
      - name: Relatório do Playwright (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
